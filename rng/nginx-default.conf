server {
    listen       8080;
    server_name  localhost;
    root   /usr/share/nginx/html;
    index  index.html;

    # The page re-rolls itself client-side on a 3-minute clock; never let a
    # cache hold a stale copy of the shell for longer than that.
    add_header Cache-Control "public, max-age=60" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
