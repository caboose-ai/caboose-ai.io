apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  service-logs.json: |
    {
      "title": "Service Logs",
      "uid": "service-logs",
      "editable": true,
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["health"],
      "time": { "from": "now-3h", "to": "now" },
      "timezone": "browser",
      "templating": { "list": [
        {
          "name": "service", "label": "Service", "type": "query",
          "datasource": { "type": "loki", "uid": "loki" },
          "query": "label_values(service)",
          "includeAll": true, "allValue": ".+", "multi": true,
          "current": { "text": "All", "value": "$__all" },
          "refresh": 2
        },
        {
          "name": "search", "label": "Search", "type": "textbox",
          "query": "", "current": { "text": "", "value": "" }
        }
      ] },
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "Log Volume by Service",
          "gridPos": { "h": 6, "w": 16, "x": 0, "y": 0 },
          "datasource": { "type": "loki", "uid": "loki" },
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "fillOpacity": 30, "drawStyle": "bars", "stacking": { "mode": "normal" } } }, "overrides": [] },
          "targets": [ { "refId": "A", "expr": "sum by (service) (count_over_time({service=~\"$service\"} |~ \"(?i)$search\" [$__auto]))", "legendFormat": "{{service}}" } ]
        },
        {
          "id": 2, "type": "timeseries", "title": "Errors by Service",
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 0 },
          "datasource": { "type": "loki", "uid": "loki" },
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "fillOpacity": 30, "drawStyle": "bars", "stacking": { "mode": "normal" } } }, "overrides": [] },
          "targets": [ { "refId": "A", "expr": "sum by (service) (count_over_time({service=~\"$service\"} |~ \"(?i)(error|panic|fatal|exception)\" [$__auto]))", "legendFormat": "{{service}}" } ]
        },
        {
          "id": 3, "type": "logs", "title": "Logs",
          "gridPos": { "h": 18, "w": 24, "x": 0, "y": 6 },
          "datasource": { "type": "loki", "uid": "loki" },
          "options": { "showTime": true, "wrapLogMessage": true, "sortOrder": "Descending", "enableLogDetails": true },
          "targets": [ { "refId": "A", "expr": "{service=~\"$service\"} |~ \"(?i)$search\"" } ]
        }
      ]
    }
  cluster-health.json: |
    {
      "title": "Cluster Health",
      "uid": "cluster-health",
      "editable": true,
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["health"],
      "time": { "from": "now-6h", "to": "now" },
      "timezone": "browser",
      "panels": [
        {
          "id": 1, "type": "stat", "title": "CPU Usage",
          "gridPos": { "h": 4, "w": 5, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100,
            "thresholds": { "mode": "absolute", "steps": [
              { "color": "green", "value": null }, { "color": "yellow", "value": 70 }, { "color": "red", "value": 90 } ] } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [ { "refId": "A", "expr": "100 * (1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))" } ]
        },
        {
          "id": 2, "type": "stat", "title": "Memory Usage",
          "gridPos": { "h": 4, "w": 5, "x": 5, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100,
            "thresholds": { "mode": "absolute", "steps": [
              { "color": "green", "value": null }, { "color": "yellow", "value": 75 }, { "color": "red", "value": 90 } ] } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [ { "refId": "A", "expr": "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)" } ]
        },
        {
          "id": 3, "type": "stat", "title": "Disk Usage",
          "gridPos": { "h": 4, "w": 5, "x": 10, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100,
            "thresholds": { "mode": "absolute", "steps": [
              { "color": "green", "value": null }, { "color": "yellow", "value": 75 }, { "color": "red", "value": 90 } ] } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [ { "refId": "A", "expr": "100 * (1 - node_filesystem_avail_bytes{mountpoint=~\"/|/home\"} / node_filesystem_size_bytes{mountpoint=~\"/|/home\"})", "legendFormat": "{{mountpoint}}" } ]
        },
        {
          "id": 4, "type": "stat", "title": "Pods Not Running",
          "gridPos": { "h": 4, "w": 4, "x": 15, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short",
            "thresholds": { "mode": "absolute", "steps": [
              { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [ { "refId": "A", "expr": "sum(kube_pod_status_phase{phase=~\"Pending|Failed|Unknown\"})" } ]
        },
        {
          "id": 5, "type": "stat", "title": "Restarts (1h)",
          "gridPos": { "h": 4, "w": 4, "x": 19, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short",
            "thresholds": { "mode": "absolute", "steps": [
              { "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 5 } ] } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [ { "refId": "A", "expr": "sum(increase(kube_pod_container_status_restarts_total[1h]))" } ]
        },
        {
          "id": 6, "type": "timeseries", "title": "CPU by Service",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "fillOpacity": 10 } }, "overrides": [] },
          "targets": [ { "refId": "A", "expr": "sum by (service) (rate(container_cpu_usage_seconds_total{image!=\"\", service!~\"|svclb-.+|coredns|local-path-provisioner|metrics-server|node-exporter|kube-state-metrics|prometheus|grafana|helm-install-.+\"}[5m]))", "legendFormat": "{{service}}" } ]
        },
        {
          "id": 7, "type": "timeseries", "title": "Memory by Service",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes", "custom": { "fillOpacity": 10 } }, "overrides": [] },
          "targets": [ { "refId": "A", "expr": "sum by (service) (container_memory_working_set_bytes{image!=\"\", service!~\"|svclb-.+|coredns|local-path-provisioner|metrics-server|node-exporter|kube-state-metrics|prometheus|grafana|helm-install-.+\"})", "legendFormat": "{{service}}" } ]
        },
        {
          "id": 8, "type": "timeseries", "title": "Node Network",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "Bps", "custom": { "fillOpacity": 10 } }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(rate(node_network_receive_bytes_total{device!~\"lo|veth.*|cni.*|flannel.*\"}[5m]))", "legendFormat": "rx" },
            { "refId": "B", "expr": "-sum(rate(node_network_transmit_bytes_total{device!~\"lo|veth.*|cni.*|flannel.*\"}[5m]))", "legendFormat": "tx" }
          ]
        },
        {
          "id": 9, "type": "timeseries", "title": "Load Average",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "fillOpacity": 0 } }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "node_load1", "legendFormat": "load1" },
            { "refId": "B", "expr": "node_load5", "legendFormat": "load5" },
            { "refId": "C", "expr": "node_load15", "legendFormat": "load15" }
          ]
        },
        {
          "id": 10, "type": "timeseries", "title": "Restarts by Service (1h increase)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "fillOpacity": 10 } }, "overrides": [] },
          "targets": [ { "refId": "A", "expr": "sum by (service) (increase(kube_pod_container_status_restarts_total{service!~\"|svclb-.+|helm-install-.+\"}[1h])) > 0", "legendFormat": "{{service}}" } ]
        },
        {
          "id": 11, "type": "timeseries", "title": "Scrape Targets Up",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0, "max": 1, "custom": { "fillOpacity": 10 } }, "overrides": [] },
          "targets": [ { "refId": "A", "expr": "min by (job) (up)", "legendFormat": "{{job}}" } ]
        },
        {
          "id": 12, "type": "timeseries", "title": "Network RX by Service",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 28 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "Bps", "custom": { "fillOpacity": 10 } }, "overrides": [] },
          "targets": [ { "refId": "A", "expr": "sum by (service) (rate(container_network_receive_bytes_total{service!~\"|svclb-.+|coredns|local-path-provisioner|metrics-server|node-exporter|kube-state-metrics|prometheus|grafana|helm-install-.+\"}[5m]))", "legendFormat": "{{service}}" } ]
        },
        {
          "id": 13, "type": "timeseries", "title": "Network TX by Service",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 28 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "Bps", "custom": { "fillOpacity": 10 } }, "overrides": [] },
          "targets": [ { "refId": "A", "expr": "sum by (service) (rate(container_network_transmit_bytes_total{service!~\"|svclb-.+|coredns|local-path-provisioner|metrics-server|node-exporter|kube-state-metrics|prometheus|grafana|helm-install-.+\"}[5m]))", "legendFormat": "{{service}}" } ]
        }
      ]
    }
