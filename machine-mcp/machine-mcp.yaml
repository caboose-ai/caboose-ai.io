apiVersion: apps/v1
kind: Deployment
metadata:
  name: machine-mcp
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: machine-mcp
  template:
    metadata:
      labels:
        app: machine-mcp
    spec:
      containers:
        - name: machine-mcp
          image: machine-mcp:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: machine-mcp-token
                  key: token
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 200m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: machine-mcp
  namespace: default
spec:
  selector:
    app: machine-mcp
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: machine-mcp
  namespace: default
spec:
  ingressClassName: traefik
  rules:
    - host: machine.caboose-ai.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: machine-mcp
                port:
                  number: 80
