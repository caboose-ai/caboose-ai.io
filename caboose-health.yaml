apiVersion: v1
kind: Service
metadata:
  name: caboose-health
  namespace: default
spec:
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Endpoints
metadata:
  name: caboose-health
  namespace: default
subsets:
  - addresses:
      - ip: 192.168.50.42
    ports:
      - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: caboose-health
  namespace: default
spec:
  ingressClassName: traefik
  rules:
    - host: health.caboose-ai.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: caboose-health
                port:
                  number: 80
