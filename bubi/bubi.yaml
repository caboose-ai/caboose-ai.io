# bubi: namespace, RBAC, quota, network policies, controller Deployment,
# services and ingress. The bot pods are NOT here; the controller creates them
# per session.
#
# NOTE: the secret `bubi-llm` is intentionally NOT defined here. Create it
# out-of-band (same pattern as caboose-fi):
#
#   kubectl -n bubi create secret generic bubi-llm \
#     --from-literal=api_key='<9router key>'
#
# v0.3.3 is stamped by deploy/build.sh when it stages this file to
# ~/apps/k3s/bubi/bubi.yaml. Apply the STAGED copy, never this one: the
# unresolved tag fails at image pull (loud, harmless) instead of silently
# rolling production back.
apiVersion: v1
kind: Namespace
metadata:
  name: bubi
  labels:
    # The controller may create pods here. "restricted" Pod Security means
    # even a compromised controller cannot create a privileged, hostNetwork
    # or hostPath pod and climb onto the node.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# Transcript storage. A hostPath volume in the pod spec is forbidden by the
# restricted profile, so the host directory is wrapped in an admin-created
# PersistentVolume; the controller's account cannot create PVs or PVCs.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bubi-data
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: bubi-manual
  claimRef:
    namespace: bubi
    name: bubi-data
  hostPath:
    path: /home/caboose/apps/data/bubi
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bubi-data
  namespace: bubi
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: bubi-manual
  volumeName: bubi-data
  resources:
    requests:
      storage: 1Gi
---
# The host CLI (`bubi new|stop|list`) uses this account instead of a
# cluster-admin kubeconfig. It can find the controller pod and exec into it,
# nothing else. The images have no shell, so exec can only run the controller
# binary itself.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bubi-operator
  namespace: bubi
---
apiVersion: v1
kind: Secret
metadata:
  name: bubi-operator-token
  namespace: bubi
  annotations:
    kubernetes.io/service-account.name: bubi-operator
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bubi-operator
  namespace: bubi
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [bubi-controller]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bubi-operator
  namespace: bubi
subjects:
  - kind: ServiceAccount
    name: bubi-operator
    namespace: bubi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bubi-operator
---
# Nothing in this namespace talks to anything unless a policy below says so.
# Without this, a pod created without the app=bubi-bot label would match no
# policy and could reach every port on the node.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: bubi
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bubi-controller
  namespace: bubi
---
# Exactly what the controller needs to run two bot pods per session. No
# exec, no logs, no cluster-scoped rights, no RBAC rights.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bubi-controller
  namespace: bubi
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [services, secrets]
    verbs: [get, list, create, delete]
  # Live CPU/memory of the bot pods for the watch page.
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bubi-controller
  namespace: bubi
subjects:
  - kind: ServiceAccount
    name: bubi-controller
    namespace: bubi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bubi-controller
---
# A bug in the controller cannot fork-bomb the node: one controller plus two
# bot pods per live session, with headroom.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: bubi
  namespace: bubi
spec:
  hard:
    pods: "14"
    limits.cpu: "3"
    limits.memory: 2Gi
    secrets: "20"
    services: "20"
---
# Bot pods: reachable only from the other bot (SSH 2222); may reach only the
# other bot, the controller's event intake, the LLM gateway and cluster DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bubi-bot
  namespace: bubi
spec:
  podSelector:
    matchLabels:
      app: bubi-bot
  policyTypes: [Ingress, Egress]
  # Bot-to-bot SSH is granted per slot below, so two matches running at once
  # cannot reach each other's machines.
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: bubi-controller
      ports:
        - protocol: TCP
          port: 8081
    # 9router LLM gateway on the node.
    - to:
        - ipBlock:
            cidr: 192.168.50.42/32
      ports:
        - protocol: TCP
          port: 20128
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Slot 1: the bots of the match in this slot may SSH to each other and to
# nobody else. One policy per concurrency slot (proto.MaxLiveSessions).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bubi-bot-slot-1
  namespace: bubi
spec:
  podSelector:
    matchLabels:
      app: bubi-bot
      bubi.caboose-ai.io/slot: "1"
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: bubi-bot
              bubi.caboose-ai.io/slot: "1"
      ports:
        - protocol: TCP
          port: 2222
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: bubi-bot
              bubi.caboose-ai.io/slot: "1"
      ports:
        - protocol: TCP
          port: 2222
---
# Slot 2: the bots of the match in this slot may SSH to each other and to
# nobody else. One policy per concurrency slot (proto.MaxLiveSessions).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bubi-bot-slot-2
  namespace: bubi
spec:
  podSelector:
    matchLabels:
      app: bubi-bot
      bubi.caboose-ai.io/slot: "2"
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: bubi-bot
              bubi.caboose-ai.io/slot: "2"
      ports:
        - protocol: TCP
          port: 2222
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: bubi-bot
              bubi.caboose-ai.io/slot: "2"
      ports:
        - protocol: TCP
          port: 2222
---
# Controller: ingress only (egress stays unrestricted so it can reach the
# Kubernetes API and the LLM gateway). 8081 (event intake) is limited to bot
# pods; 8080 (Traefik, in kube-system) and 9090 (monitoring) stay open.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bubi-controller-internal
  namespace: bubi
spec:
  podSelector:
    matchLabels:
      app: bubi-controller
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: bubi-bot
      ports:
        - protocol: TCP
          port: 8081
    # Public HTTP only via Traefik (so CF-Connecting-IP cannot be spoofed by
    # other pods), plus kubelet probes from the node's pod-network gateway.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - ipBlock:
            cidr: 10.42.0.1/32
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
  # The controller only ever talks to the Kubernetes API (it uses
  # KUBERNETES_SERVICE_HOST, so no DNS). The bots call the LLM, not it.
  egress:
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 192.168.50.42/32
      ports:
        - protocol: TCP
          port: 6443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bubi-controller
  namespace: bubi
spec:
  replicas: 1
  # Recreate: one writer on the hostPath, and one controller owning the live
  # session at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bubi-controller
  template:
    metadata:
      labels:
        app: bubi-controller
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      # The controller reaches the Kubernetes API with this account's token,
      # so the token must stay mounted (do not set automountServiceAccountToken: false).
      serviceAccountName: bubi-controller
      securityContext:
        runAsNonRoot: true
        # Matches the owner of the hostPath (id -u caboose = 1000).
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          # Pulled from the node's local registry. Never re-push the same tag:
          # imagePullPolicy IfNotPresent would serve the stale image.
          image: localhost:5000/bubi-controller:v0.3.3
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: intake
            - containerPort: 9090
              name: metrics
          env:
            - name: BUBI_DATA_DIR
              value: /data
            - name: BUBI_PUBLIC_URL
              value: https://boba.caboose-ai.io
            - name: BUBI_NAMESPACE
              value: bubi
            - name: BUBI_BOT_IMAGE
              value: localhost:5000/bubi-bot:v0.3.3
            - name: BUBI_LLM_BASE_URL
              value: http://192.168.50.42:20128
            # Classic matches use bōba's own gateway combo (quick models first, the
            # reasoning model last), so tuning it never touches the shared "fast".
            - name: BUBI_LLM_MODEL
              value: boba
            # The free models spend most of a call on hidden reasoning, and on
            # full-size prompts "low" is not honoured (median 35s, some calls
            # burn the whole budget). "off" measured ~5s with replies of the
            # same length and quality.
            - name: BUBI_CLASSIC_REASONING
              value: "off"
            - name: BUBI_LLM_SECRET_NAME
              value: bubi-llm
            - name: BUBI_INTERNAL_URL
              value: http://bubi-controller-internal.bubi.svc:8081
            - name: BUBI_RETENTION
              value: 168h
            - name: BUBI_MAX_MESSAGES
              value: "40"
            - name: BUBI_SESSION_TTL
              value: 30m
            - name: BUBI_ORCHESTRATOR
              value: k8s
            - name: BUBI_SSE_MAX_CLIENTS
              value: "100"
            # Per visitor address. A household behind one address watching two
            # matches on a few devices needs more than a handful.
            - name: BUBI_SSE_MAX_PER_IP
              value: "12"
            - name: TZ
              value: America/New_York
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: bubi-data }
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: bubi-controller
  namespace: bubi
spec:
  selector:
    app: bubi-controller
  ports:
    - port: 80
      targetPort: 8080
---
# Event intake for the bot pods. ClusterIP only; the NetworkPolicy limits it
# to app=bubi-bot and no Ingress points at it.
apiVersion: v1
kind: Service
metadata:
  name: bubi-controller-internal
  namespace: bubi
spec:
  selector:
    app: bubi-controller
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bubi-controller
  namespace: bubi
spec:
  ingressClassName: traefik
  rules:
    # Single-level hostname, per the cluster's Cloudflare Tunnel rule.
    - host: boba.caboose-ai.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bubi-controller
                port:
                  number: 80
    # The show was first called bubi; old links keep working.
    - host: bubi.caboose-ai.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bubi-controller
                port:
                  number: 80
