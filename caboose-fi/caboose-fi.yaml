# caboose-fi: namespace, PVC, deployment, services, ingress.
#
# NOTE: the secret `caboose-fi-secrets` is intentionally NOT defined here. Create
# it out-of-band (same pattern as moto-edit and the cluster's tunnel token):
#
#   kubectl -n caboose-fi create secret generic caboose-fi-secrets \
#     --from-literal=APP_PASSWORD='<password>' \
#     --from-literal=SESSION_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=SIMPLEFIN_ACCESS_URL='<claimed access url>'
#
# To ADD or ROTATE one key later, merge-patch it -- do NOT re-run the create
# above piped into `kubectl apply`. Once the last-applied annotation exists,
# an apply that omits the other keys deletes them:
#
#   kubectl -n caboose-fi patch secret caboose-fi-secrets --type merge \
#     -p '{"stringData":{"APP_PASSWORD":"<new>"}}' 
apiVersion: v1
kind: Namespace
metadata:
  name: caboose-fi
---
# /data holds registry.db and households/<id>.db — every record the app has.
# It is a real volume, not an emptyDir: an emptyDir here means a pod restart
# silently loses everything.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caboose-fi-data
  namespace: caboose-fi
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caboose-fi
  namespace: caboose-fi
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the PVC is ReadWriteOnce, and two pods would
  # also mean two writers racing on the same state.json.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: caboose-fi
  template:
    metadata:
      labels:
        app: caboose-fi
      # The cluster's Prometheus has a generic `kubernetes-pods` job that keeps
      # any pod carrying these annotations, so this needs no scrape-config
      # change of its own. Metrics are on 9090, a port no Service or Ingress
      # exposes — the Ingress fronts every path on 8080, so they cannot live
      # there.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: caboose-fi
          # Pulled from the node's local registry, NOT a containerd-imported
          # tag. A bare `caboose-fi:vX` here makes k3s try Docker Hub and fail with
          # ImagePullBackOff -- the mistake that took moto-edit down twice.
          #
          # KEEP THIS IN SYNC WITH WHAT IS DEPLOYED. Releases shipped with
          # `kubectl -n caboose-fi set image` do NOT write back here, so this line
          # goes stale silently and a later `kubectl apply -f` would roll
          # production back to whatever it says.
          # __VERSION__ is stamped by deploy/build.sh when it stages this
          # file. It is left unresolved in the repository on purpose: a real
          # tag here goes stale the moment anything ships, and applying the
          # stale copy silently rolls production back. That happened -- an
          # apply of this file took a running v0.10.3 down to v0.5.3, and the
          # old binary, not knowing about per-household databases, created a
          # fresh empty one beside the real data and served it.
          #
          # Unresolved, the same mistake fails at image pull: loud, and
          # harmless. Apply the staged copy that build.sh writes, never this.
          image: localhost:5000/caboose-fi:v0.52.2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: metrics
          env:
            - name: PORT
              value: "8080"
            - name: DATA_DIR
              value: /data
            - name: PUBLIC_DIR
              value: /app/public
            - name: TZ
              value: America/New_York
            # readOnlyRootFilesystem is on, so anything that wants scratch
            # space has to be pointed at the volume. SQLite spills large
            # sorts and VACUUM output to a temp dir, and the default would
            # be an unwritable /tmp.
            - name: TMPDIR
              value: /data
            - name: BASE_URL
              value: https://cab-fi.caboose-ai.io
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: caboose-fi-secrets
                  key: APP_PASSWORD
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: caboose-fi-secrets
                  key: SESSION_SECRET
            # Optional: without it the app serves what it already has rather
            # than refusing to start. A credential outage must not also be a
            # history outage.
            # Second factor. Optional: without it the app asks for a password
            # only. Generate with `caboose-fi -totp-setup`, enrol the code in
            # an authenticator FIRST, then set this -- the app demands a code
            # the moment the key exists.
            - name: TOTP_SECRET
              valueFrom:
                secretKeyRef: { name: caboose-fi-secrets, key: TOTP_SECRET, optional: true }
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: caboose-fi-secrets, key: GOOGLE_CLIENT_ID, optional: true }
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: caboose-fi-secrets, key: GOOGLE_CLIENT_SECRET, optional: true }
            - name: SIMPLEFIN_ACCESS_URL
              valueFrom:
                secretKeyRef:
                  name: caboose-fi-secrets
                  key: SIMPLEFIN_ACCESS_URL
                  optional: true
            # Ask (/ask). Optional: without the key the page does not exist.
            # Added by deploy/setup-ask.sh from 1Password, never by hand. The
            # model is the owner's pick from the askeval results.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: caboose-fi-secrets, key: ANTHROPIC_API_KEY, optional: true }
            - name: ASK_MODEL
              value: claude-opus-5
            - name: ASK_EFFORT
              value: medium
            # Nightly encrypted backup to Backblaze B2. All optional: without them the
            # app runs and says on the dashboard that no backup has run, which
            # is better than refusing to start.
            #
            # BACKUP_AGE_RECIPIENT is a PUBLIC key. The node can write backups
            # and cannot read them back; the private key must live somewhere
            # this cluster cannot reach, or the offsite copy protects nothing.
            - name: BACKUP_AGE_RECIPIENT
              valueFrom:
                secretKeyRef: { name: caboose-fi-secrets, key: BACKUP_AGE_RECIPIENT, optional: true }
            - name: BACKUP_S3_ENDPOINT
              valueFrom:
                secretKeyRef: { name: caboose-fi-secrets, key: BACKUP_S3_ENDPOINT, optional: true }
            - name: BACKUP_S3_BUCKET
              valueFrom:
                secretKeyRef: { name: caboose-fi-secrets, key: BACKUP_S3_BUCKET, optional: true }
            # Must match the endpoint's region. Cloudflare R2 uses "auto";
            # Backblaze B2 and AWS want the real region (us-east-005 here,
            # us-east-1, ...) because it is signed into every request, and a
            # mismatch fails as SignatureDoesNotMatch rather than as a region
            # error -- which sends you hunting for the wrong problem.
            - name: BACKUP_S3_REGION
              valueFrom:
                secretKeyRef: { name: caboose-fi-secrets, key: BACKUP_S3_REGION, optional: true }
            # Key prefix inside the bucket. It must satisfy any name-prefix
            # restriction on the credential, or every upload fails as
            # "not entitled" -- which reads like a permissions problem and
            # sends you auditing capabilities that were fine all along.
            - name: BACKUP_PREFIX
              valueFrom:
                secretKeyRef: { name: caboose-fi-secrets, key: BACKUP_PREFIX, optional: true }
            - name: BACKUP_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: caboose-fi-secrets, key: BACKUP_S3_ACCESS_KEY_ID, optional: true }
            - name: BACKUP_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: caboose-fi-secrets, key: BACKUP_S3_SECRET_ACCESS_KEY, optional: true }
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: caboose-fi-data
---
apiVersion: v1
kind: Service
metadata:
  name: caboose-fi
  namespace: caboose-fi
spec:
  selector:
    app: caboose-fi
  ports:
    - port: 80
      targetPort: 8080
---
# LAN access without going out through Cloudflare and back.
apiVersion: v1
kind: Service
metadata:
  name: caboose-fi-lan
  namespace: caboose-fi
spec:
  type: NodePort
  selector:
    app: caboose-fi
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30082
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: caboose-fi
  namespace: caboose-fi
spec:
  ingressClassName: traefik
  rules:
    # Single-level hostname, per the cluster's Cloudflare Tunnel rule:
    # anything deeper than one label is not covered by the edge certificate.
    - host: cab-fi.caboose-ai.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: caboose-fi
                port:
                  number: 80
