global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['localhost:9100']

  - job_name: 'mattermost'
    static_configs:
      - targets: ['localhost:8067']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['localhost:8181']
