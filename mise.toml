[tools]
go = "latest"
pnpm = "latest"

[env]
HOMELAB_DOMAIN = "caboose-ai.io"
HOMELAB_COMPOSE_DIR = "/opt/homelab"
HOMELAB_SERVE_MODE = "public"

[tasks.build]
description = "Build all binaries"
run = "go build ./..."

[tasks."homelab:build"]
description = "Build the homelab CLI binary"
run = "go build -o ./homelab ./cmd/homelab"

[tasks.homelab]
description = "Build and run the homelab TUI installer against the configured stack"
raw = true
run = "go build -o ./homelab ./cmd/homelab && ./homelab install --domain \"$HOMELAB_DOMAIN\" --compose-dir \"$HOMELAB_COMPOSE_DIR\" --serve-mode \"$HOMELAB_SERVE_MODE\""

[tasks.install]
description = "Run the verified non-interactive homelab install"
run = "go run ./cmd/homelab install --non-interactive --domain \"$HOMELAB_DOMAIN\" --compose-dir \"$HOMELAB_COMPOSE_DIR\" --serve-mode \"$HOMELAB_SERVE_MODE\""

[tasks."homelab:install"]
description = "Run the verified non-interactive homelab install"
run = "go run ./cmd/homelab install --non-interactive --domain \"$HOMELAB_DOMAIN\" --compose-dir \"$HOMELAB_COMPOSE_DIR\" --serve-mode \"$HOMELAB_SERVE_MODE\""

[tasks."homelab:install-tui"]
description = "Build and run the interactive homelab TUI installer"
raw = true
run = "go build -o ./homelab ./cmd/homelab && ./homelab install --domain \"$HOMELAB_DOMAIN\" --compose-dir \"$HOMELAB_COMPOSE_DIR\" --serve-mode \"$HOMELAB_SERVE_MODE\""

[tasks.reset]
description = "Reset homelab stack (keeps .env credentials by default)"
run = "go run ./cmd/homelab reset --yes --keep-env --domain \"$HOMELAB_DOMAIN\" --compose-dir \"$HOMELAB_COMPOSE_DIR\""

[tasks."homelab:reset"]
description = "Reset homelab stack (keeps .env credentials by default)"
run = "go run ./cmd/homelab reset --yes --keep-env --domain \"$HOMELAB_DOMAIN\" --compose-dir \"$HOMELAB_COMPOSE_DIR\""

[tasks."factory-reset"]
description = "Full factory reset — tears down everything including .env credentials"
run = "go run ./cmd/homelab reset --yes --domain \"$HOMELAB_DOMAIN\" --compose-dir \"$HOMELAB_COMPOSE_DIR\""

[tasks."homelab:factory-reset"]
description = "Full factory reset — tears down everything including .env credentials"
run = "go run ./cmd/homelab reset --yes --domain \"$HOMELAB_DOMAIN\" --compose-dir \"$HOMELAB_COMPOSE_DIR\""

[tasks.reinstall]
description = "Reset (keep .env) then non-interactive install"
run = "go run ./cmd/homelab reset --yes --keep-env --domain \"$HOMELAB_DOMAIN\" --compose-dir \"$HOMELAB_COMPOSE_DIR\" && go run ./cmd/homelab install --non-interactive --domain \"$HOMELAB_DOMAIN\" --compose-dir \"$HOMELAB_COMPOSE_DIR\" --serve-mode \"$HOMELAB_SERVE_MODE\""

[tasks."homelab:reinstall"]
description = "Reset (keep .env) then non-interactive install"
run = "go run ./cmd/homelab reset --yes --keep-env --domain \"$HOMELAB_DOMAIN\" --compose-dir \"$HOMELAB_COMPOSE_DIR\" && go run ./cmd/homelab install --non-interactive --domain \"$HOMELAB_DOMAIN\" --compose-dir \"$HOMELAB_COMPOSE_DIR\" --serve-mode \"$HOMELAB_SERVE_MODE\""

[tasks."factory-reinstall"]
description = "Full factory reset then non-interactive install (wipes .env)"
run = "go run ./cmd/homelab reset --yes --domain \"$HOMELAB_DOMAIN\" --compose-dir \"$HOMELAB_COMPOSE_DIR\" && go run ./cmd/homelab install --non-interactive --domain \"$HOMELAB_DOMAIN\" --compose-dir \"$HOMELAB_COMPOSE_DIR\" --serve-mode \"$HOMELAB_SERVE_MODE\""

[tasks."homelab:factory-reinstall"]
description = "Full factory reset then non-interactive install (wipes .env)"
run = "go run ./cmd/homelab reset --yes --domain \"$HOMELAB_DOMAIN\" --compose-dir \"$HOMELAB_COMPOSE_DIR\" && go run ./cmd/homelab install --non-interactive --domain \"$HOMELAB_DOMAIN\" --compose-dir \"$HOMELAB_COMPOSE_DIR\" --serve-mode \"$HOMELAB_SERVE_MODE\""

[tasks.recovery]
description = "Generate an Authentik admin recovery URL"
run = "go run ./cmd/homelab recovery --domain \"$HOMELAB_DOMAIN\" --compose-dir \"$HOMELAB_COMPOSE_DIR\""

[tasks."homelab:recovery"]
description = "Generate an Authentik admin recovery URL"
run = "go run ./cmd/homelab recovery --domain \"$HOMELAB_DOMAIN\" --compose-dir \"$HOMELAB_COMPOSE_DIR\""

[tasks."homelab:oauth-setup"]
description = "Print external OAuth and Turnstile setup values"
run = "go run ./cmd/homelab oauth-setup --domain \"$HOMELAB_DOMAIN\""

[tasks."paperclip:seed"]
description = "Seed the Paperclip software-shop company profile"
run = "go run ./cmd/homelab paperclip seed-company --profile software-shop --repo /home/caboose/dev/caboose-ai.io"

[tasks."paperclip:up"]
description = "Start the optional Paperclip profile"
run = "docker compose -f \"$HOMELAB_COMPOSE_DIR/docker-compose.yml\" --profile paperclip up -d paperclip paperclip-db"

[tasks."paperclip:down"]
description = "Stop the optional Paperclip profile"
run = "docker compose -f \"$HOMELAB_COMPOSE_DIR/docker-compose.yml\" --profile paperclip stop paperclip paperclip-db"

[tasks."paperclip:status"]
description = "Show Paperclip service status"
run = "go run ./cmd/homelab service --domain \"$HOMELAB_DOMAIN\" --compose-dir \"$HOMELAB_COMPOSE_DIR\" paperclip status"

[tasks."paperclip:smoke"]
description = "Run the targeted Paperclip SSO smoke flow"
run = "go run ./cmd/homelab service --domain \"$HOMELAB_DOMAIN\" --compose-dir \"$HOMELAB_COMPOSE_DIR\" paperclip smoke"

[tasks."homelab:create-turnstile"]
description = "Create or verify the Cloudflare Turnstile widget via API"
run = "go run ./cmd/homelab oauth-setup --domain \"$HOMELAB_DOMAIN\" --create-turnstile"

[tasks."service:status"]
description = "Show status for one registered service"
run = "go run ./cmd/homelab service --domain \"$HOMELAB_DOMAIN\" --compose-dir \"$HOMELAB_COMPOSE_DIR\" status"

[tasks."service:configure"]
description = "Configure one registered service"
run = "go run ./cmd/homelab service --domain \"$HOMELAB_DOMAIN\" --compose-dir \"$HOMELAB_COMPOSE_DIR\" configure"

[tasks."service:smoke"]
description = "Run the smoke flow for one registered service"
run = "go run ./cmd/homelab service --domain \"$HOMELAB_DOMAIN\" --compose-dir \"$HOMELAB_COMPOSE_DIR\" smoke"

[tasks."openclaw:status"]
description = "Show OpenClaw daemon and model status"
run = "openclaw daemon status && openclaw models status --json"

[tasks."openclaw:restart"]
description = "Restart the OpenClaw gateway daemon"
run = "openclaw daemon restart"

[tasks."openclaw:smoke"]
description = "Run a one-shot OpenClaw Ollama gateway smoke check"
run = "openclaw infer model run --gateway --prompt 'Reply with exactly: ok' --json"

[tasks."telegram-agent:build"]
description = "Build the Telegram agent bridge"
run = "go build -buildvcs=false -o ./telegram-agent ./cmd/telegram-agent"

[tasks."telegram-agent:run"]
description = "Run the Telegram agent bridge with long polling"
run = "go run ./cmd/telegram-agent"

[tasks."telegram-agent:notify"]
description = "Send a one-shot Telegram notification to configured allowed users"
run = "go run ./cmd/telegram-agent notify"

[tasks.mcp]
description = "Build and run the MCP server"
run = "go build -o ./mcp-server ./cmd/mcp && ./mcp-server"

[tasks.test]
description = "Run all tests"
run = "go test ./... -v"

[tasks.down]
description = "Stop containers (keep data)"
run = "docker compose -f \"$HOMELAB_COMPOSE_DIR/docker-compose.yml\" down"

[tasks."sso:check"]
description = "Run SSO smoke tests against the live stack"
run = "go test -tags integration ./internal/smoketest/ -v -timeout 5m"

[tasks."sso:check-quick"]
description = "Run SSO API config checks only"
run = "go test -tags integration ./internal/smoketest/ -run TestSSO_Config -v"

[tasks."sso:e2e"]
description = "Run browser SSO flows with click/input screenshot evidence"
run = "SMOKETEST_EVIDENCE=1 go test -tags integration ./internal/smoketest/ -run TestSSO_BrowserFlows -v -timeout 10m"

[tasks."homelab:e2e-reset"]
description = "Destructive reset, install, then browser SSO evidence test"
run = "go run ./cmd/homelab reset --yes --domain \"$HOMELAB_DOMAIN\" --compose-dir \"$HOMELAB_COMPOSE_DIR\" && go run ./cmd/homelab install --non-interactive --domain \"$HOMELAB_DOMAIN\" --compose-dir \"$HOMELAB_COMPOSE_DIR\" --serve-mode \"$HOMELAB_SERVE_MODE\" && SMOKETEST_EVIDENCE=1 go test -tags integration ./internal/smoketest/ -run 'TestSSO_Config|TestSSO_Endpoints|TestSSO_BrowserFlows' -v -timeout 15m"
