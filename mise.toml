[tools]
go = "latest"

[tasks.build]
description = "Build all binaries"
run = "go build ./..."

[tasks.homelab]
description = "Build and run the homelab TUI installer"
raw = true
run = "go build -o ./homelab ./cmd/homelab && ./homelab install"

[tasks.mcp]
description = "Build and run the MCP server"
run = "go build -o ./mcp-server ./cmd/mcp && ./mcp-server"

[tasks.test]
description = "Run all tests"
run = "go test ./internal/... -v"

[tasks.reset]
description = "Stop containers and remove volumes, then rebuild"
run = "docker compose -f dev/homelab/docker-compose.yml down -v && go build -o ./homelab ./cmd/homelab && ./homelab reset"

[tasks.down]
description = "Stop containers (keep data)"
run = "docker compose -f dev/homelab/docker-compose.yml down"

[tasks."sso:check"]
description = "Run SSO smoke tests against the live stack"
run = "go test -tags integration ./internal/smoketest/ -v -timeout 5m"

[tasks."sso:check-quick"]
description = "Run SSO API config checks only"
run = "go test -tags integration ./internal/smoketest/ -run TestSSO_Config -v"
