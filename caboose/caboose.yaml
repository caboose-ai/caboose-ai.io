# caboose: namespace, deployment, service, ingress — STATELESS.
#
# The pod is a pure function of the `state` branch of caboose-ai/caboose:
# at boot it fetches the published state tree into an ephemeral /tmp cache and
# serves. No PVC, no hostPath mounts, no in-process sync. The state branch is
# written exclusively by .github/workflows/refresh-brain.yml.
#
# NOTE: the secret `caboose-secrets` is intentionally NOT defined here. Create
# it out-of-band:
#
#   kubectl -n caboose create secret generic caboose-secrets \
#     --from-file=GH_TOKEN=<(gh auth token) \
#     --from-file=PAPERCLIP_TOKEN=<(grep '^PAPERCLIP_TOKEN=' ~/dev/paperclip/.env | cut -d= -f2)
#
# GH_TOKEN: fetches the (private) state branch and commits kb_update writes.
# PAPERCLIP_TOKEN: brain_act -> the audited executor queue on the box.
apiVersion: v1
kind: Namespace
metadata:
  name: caboose
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caboose
  namespace: caboose
spec:
  replicas: 1
  strategy:
    type: RollingUpdate # stateless: any replica serves from git state
  selector:
    matchLabels:
      app: caboose
  template:
    metadata:
      labels:
        app: caboose
      # Generic kubernetes-pods scrape job picks these up. Metrics are on
      # 9090, a port no Service or Ingress exposes.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: caboose
          # KEEP THIS IN SYNC WITH WHAT IS DEPLOYED.
          image: localhost:5000/caboose:v0.10.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 8123
              name: http
            - containerPort: 8124
              name: internal
            - containerPort: 9090
              name: metrics
          args:
            - serve
            - --transport=http
            - --address=0.0.0.0:8123
            - --internal-address=0.0.0.0:8124
            - --metrics-address=0.0.0.0:9090
            - --kb-dir=/app/kb
            - --cache-dir=/tmp/cache
            - --brain-dir=/tmp/cache
            - --state-git=https://github.com/caboose-ai/caboose.git
            - --state-branch=state
            - --state-refresh=30m
            - --kb-repo=caboose-ai/caboose
          env:
            - name: TZ
              value: America/New_York
            - name: CABOOSE_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: caboose-secrets
                  key: GH_TOKEN
                  optional: true
            - name: PAPERCLIP_URL
              value: http://192.168.50.42:8787
            - name: PAPERCLIP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: caboose-secrets
                  key: PAPERCLIP_TOKEN
                  optional: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { cpu: 500m, memory: 512Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: 9090 }
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /healthz, port: 9090 }
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        # Ephemeral state cache: rebuilt from git on every boot. Losing it
        # loses nothing — that is the point.
        - name: tmp
          emptyDir: {}
---
# PUBLIC entry: the ClusterIP both Ingress rules below back onto
# (caboose.caboose-ai.io/skills and status.caboose-ai.io). Only the public
# surface listens on 8123; MCP and the org page are on the internal port.
apiVersion: v1
kind: Service
metadata:
  name: caboose
  namespace: caboose
spec:
  type: ClusterIP
  selector:
    app: caboose
  ports:
    - name: http
      port: 80
      targetPort: 8123
---
# LAN-only entry to the FULL brain (MCP + org page). NodePort + ufw rule
# scoped to 192.168.50.0/24; the tunnel never routes here.
apiVersion: v1
kind: Service
metadata:
  name: caboose-internal
  namespace: caboose
spec:
  type: NodePort
  selector:
    app: caboose
  ports:
    - name: internal
      port: 80
      targetPort: 8124
      nodePort: 30222
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: caboose
  namespace: caboose
  # No traefik annotations: the Cloudflare Tunnel enters traefik on the `web`
  # entrypoint (port 80), same as every app here.
spec:
  ingressClassName: traefik
  rules:
    # PUBLIC brain surface: only /skills. The org page and MCP are LAN-only.
    - host: caboose.caboose-ai.io
      http:
        paths:
          - path: /skills
            pathType: Prefix
            backend:
              service:
                name: caboose
                port:
                  name: http
    # External status page — host-routed (MCP-first, skills, live probes).
    - host: status.caboose-ai.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: caboose
                port:
                  name: http