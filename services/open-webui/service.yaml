slug: open-webui
display_name: Open WebUI
url_key: open_webui
compose_services:
  - open-webui
secrets:
  - OPEN_WEBUI_OAUTH_CLIENT_ID
  - OPEN_WEBUI_OAUTH_CLIENT_SECRET
configurator: open-webui
smoke_flow: open-webui
dashboard:
  show: true
  path: /oauth/oidc/login
sso:
  mode: oidc
health:
  url_key: open_webui
  path: /
  kind: http
docs:
  - README.md
