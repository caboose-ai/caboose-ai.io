name: Update Homebrew Tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to the Homebrew tap, for example v0.1.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare-homebrew-tap:
    name: Prepare tap formulae
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      archive_url: ${{ steps.archive.outputs.url }}
      sha256: ${{ steps.archive.outputs.sha256 }}
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Resolve release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${RELEASE_TAG:-$INPUT_TAG}"
          if [[ -z "$tag" ]]; then
            echo "::error::Release tag is required."
            exit 1
          fi
          if [[ ! "$tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must look like vX.Y.Z."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Require tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "::error::HOMEBREW_TAP_TOKEN must be set with write access to caboose-ai/homebrew-tap."
            exit 1
          fi

      - name: Check out source repo
        uses: actions/checkout@v6
        with:
          path: source

      - name: Check out Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: caboose-ai/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false

      - name: Compute source archive checksum
        id: archive
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          url="https://github.com/caboose-ai/caboose-ai.io/archive/refs/tags/${TAG}.tar.gz"
          sha256="$(curl -fsSL "$url" | shasum -a 256 | awk '{print $1}')"
          if [[ ! "$sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Computed SHA256 is invalid."
            exit 1
          fi

          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Computed $sha256 for $url"

      - name: Update formulae
        run: |
          uv run python source/.github/scripts/update_homebrew_tap.py \
            --tap-dir tap \
            --tag "${{ steps.release.outputs.tag }}" \
            --sha256 "${{ steps.archive.outputs.sha256 }}"

      - name: Validate formula syntax
        working-directory: tap
        run: |
          ruby -c Formula/caboose-homelab.rb
          ruby -c Formula/caboose-homelab-mcp.rb

      - name: Check for formula changes
        id: diff
        working-directory: tap
        run: |
          git diff -- Formula/caboose-homelab.rb Formula/caboose-homelab-mcp.rb
          if git diff --quiet -- Formula/caboose-homelab.rb Formula/caboose-homelab-mcp.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Formulae already point at ${{ steps.release.outputs.tag }}."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write tap update patch
        if: steps.diff.outputs.changed == 'true'
        working-directory: tap
        run: |
          git diff -- Formula/caboose-homelab.rb Formula/caboose-homelab-mcp.rb > ../homebrew-tap.patch

      - name: Upload tap update patch
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: homebrew-tap-patch
          path: homebrew-tap.patch
          if-no-files-found: error

      - name: Set up Homebrew
        if: steps.diff.outputs.changed == 'true'
        uses: Homebrew/actions/setup-homebrew@main

      - name: Smoke test Homebrew formulae
        if: steps.diff.outputs.changed == 'true'
        working-directory: source
        env:
          HOMEBREW_NO_ANALYTICS: "1"
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: uv run python .github/scripts/brew_release_smoke.py --tap-dir ../tap

  deploy-homebrew-tap:
    name: Deploy tap formulae
    runs-on: ubuntu-latest
    needs: prepare-homebrew-tap
    if: needs.prepare-homebrew-tap.outputs.changed == 'true'
    environment:
      name: homebrew-tap-deploy
      url: https://github.com/caboose-ai/homebrew-tap
    steps:
      - name: Require tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "::error::HOMEBREW_TAP_TOKEN must be set with write access to caboose-ai/homebrew-tap."
            exit 1
          fi

      - name: Check out source repo
        uses: actions/checkout@v6
        with:
          path: source

      - name: Check out Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: caboose-ai/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Download tap update patch
        uses: actions/download-artifact@v7
        with:
          name: homebrew-tap-patch

      - name: Apply tap update patch
        working-directory: tap
        run: |
          git apply ../homebrew-tap.patch
          if git diff --quiet -- Formula/caboose-homelab.rb Formula/caboose-homelab-mcp.rb; then
            echo "::error::Tap update patch did not change formulae."
            exit 1
          fi

      - name: Validate formula syntax after approval
        working-directory: tap
        run: |
          ruby -c Formula/caboose-homelab.rb
          ruby -c Formula/caboose-homelab-mcp.rb

      - name: Set up uv after approval
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false

      - name: Set up Homebrew after approval
        uses: Homebrew/actions/setup-homebrew@main

      - name: Smoke test Homebrew formulae after approval
        working-directory: source
        env:
          HOMEBREW_NO_ANALYTICS: "1"
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: uv run python .github/scripts/brew_release_smoke.py --tap-dir ../tap

      - name: Commit and push tap update
        working-directory: tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.prepare-homebrew-tap.outputs.tag }}
          SHA256: ${{ needs.prepare-homebrew-tap.outputs.sha256 }}
          ARCHIVE_URL: ${{ needs.prepare-homebrew-tap.outputs.archive_url }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/caboose-homelab.rb Formula/caboose-homelab-mcp.rb
          git commit -m "chore: update caboose-ai.io to ${TAG}" \
            -m "Source archive: ${ARCHIVE_URL}" \
            -m "SHA256: ${SHA256}" \
            -m "Approved and deployed from caboose-ai/caboose-ai.io workflow ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          git push origin HEAD:main
