name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          conventional_pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          legacy_bracket_pattern='^\[(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)\] .+'

          if [[ "$PR_TITLE" =~ $conventional_pattern ]]; then
            exit 0
          fi

          if [[ "$PR_TITLE" =~ $legacy_bracket_pattern ]]; then
            echo "::notice::Accepted legacy bracketed PR title. Prefer Conventional Commits for new PRs."
            exit 0
          fi

          echo "::error::Pull request title must follow Conventional Commits."
          echo "Expected: type(scope): description"
          echo "Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
          echo "Breaking changes may use !, for example: feat!: change install contract"
          echo "Legacy bracketed titles are accepted as [type] description during transition."
          echo "Actual: $PR_TITLE"
          exit 1

  tier1-contract-safety:
    name: Tier 1 contract safety
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Detect Tier 1 trigger paths
        id: tier1_paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            tier1:
              - 'services/**/service.yaml'
              - 'internal/smoketest/**'
              - 'internal/service/**'
              - 'internal/install/**'

      - name: Explain Tier 1 skip
        if: steps.tier1_paths.outputs.tier1 != 'true'
        run: |
          echo "Tier 1 contract safety not required for this change set."
          echo "Trigger paths: services/**/service.yaml, internal/smoketest/**, internal/service/**, internal/install/**"

      - name: Set up Go
        if: steps.tier1_paths.outputs.tier1 == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Download modules
        if: steps.tier1_paths.outputs.tier1 == 'true'
        run: go mod download

      - name: Verify smoke flow manifest contracts
        if: steps.tier1_paths.outputs.tier1 == 'true'
        run: go test ./internal/smoketest -run 'TestPaperclipSmokeFlowResolvesToProxyFlow|TestServiceManifestSmokeFlowsResolve|TestHealthOnlyServicesDoNotDeclareSmokeFlows' -v

  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false

      - name: Run release helper tests
        run: uv run python -m unittest discover -s .github/scripts -p '*_test.py'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify Go toolchain contract
        run: ./dev/check-go-toolchain.sh

      - name: Run unit tests
        run: go test ./...

      - name: Build homelab
        run: |
          go build -trimpath -buildvcs=false -ldflags "-s -w" -o /tmp/homelab ./cmd/homelab
          set +e
          /tmp/homelab > /tmp/homelab.out 2>&1
          status=$?
          set -e
          test "$status" -eq 1
          grep -q "Usage: homelab <command> \\[flags\\]" /tmp/homelab.out
          /tmp/homelab mcp access --help > /tmp/homelab-mcp-admin.out 2>&1
          grep -q "Usage: homelab mcp access" /tmp/homelab-mcp-admin.out

      - name: Build homelab-mcp
        run: |
          go build -trimpath -buildvcs=false -ldflags "-s -w" -o /tmp/homelab-mcp ./cmd/mcp
          /tmp/homelab-mcp -help > /tmp/homelab-mcp.out 2>&1
          grep -q "Path to homelab.yml config file" /tmp/homelab-mcp.out
          /tmp/homelab-mcp access --help > /tmp/homelab-mcp-access.out 2>&1
          grep -q "Usage: homelab-mcp access" /tmp/homelab-mcp-access.out

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
